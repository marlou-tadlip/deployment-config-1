apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: flask-app
  labels:
    app: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
   metadata:
     labels:
       app: flask-app
   spec:
     containers:
     - name: flask-app
       image: zenkript/python-flaskapp:v305-b89caba
       ports:
       - containerPort: 5000
